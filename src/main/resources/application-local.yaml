spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dev_db
    username: dev_user
    password: dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  data:
    redis:
      host: localhost
      port: 6379
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %magenta(%-5level) [%thread] %logger{36} : %msg%n"