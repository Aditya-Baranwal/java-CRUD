logging:
  level:
   root: INFO
   com.aditya.lms: INFO
   org.springframework.web: INFO
   org.hibernate.SQL: WARN
   org.hibernate.orm.jdbc.bind: WARN
  pattern:
   console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%5p","app":"lms-core","thread":"%t","logger":"%logger{36}","requestId":"%X{requestId:-na}","userId":"%X{userId:-anonymous}","method":"%X{method:-na}","path":"%X{path:-na}","message":"%m","exception":"%replace(%ex{full}){''\n'',''\\n''}"}%n'
  file:
   name: logs/lms-core.log
  logback:
   rollingpolicy:
     file-name-pattern: logs/lms-core.%d{yyyy-MM-dd}.%i.log.gz
     max-file-size: 10MB
     max-history: 14
     total-size-cap: 1GB