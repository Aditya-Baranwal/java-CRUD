databaseChangeLog:
  - changeSet:
      id: 005-create-progress-table
      author: copilot
      changes:
        - createSequence:
            sequenceName: progress_id_seq
            startValue: 1
            incrementBy: 1
        - sql:
            dbms: postgresql
            sql: CREATE TYPE lesson_status AS ENUM ('UNSTARTED', 'STARTED', 'FINISHED');
        - createTable:
            tableName: progress
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_progress
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: lesson_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: lesson_status
                  type: lesson_status
                  defaultValue: UNSTARTED
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: TIMESTAMP
              - column:
                  name: completed_at
                  type: TIMESTAMP
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: progress
            baseColumnNames: user_id
            referencedTableName: user
            referencedColumnNames: id
            constraintName: fk_progress_user
        - addForeignKeyConstraint:
            baseTableName: progress
            baseColumnNames: lesson_id
            referencedTableName: lesson
            referencedColumnNames: id
            constraintName: fk_progress_lesson
        - addUniqueConstraint:
            tableName: progress
            columnNames: user_id, lesson_id
            constraintName: uk_progress
        - createIndex:
            indexName: idx_progress_user
            tableName: progress
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_progress_lesson
            tableName: progress
            columns:
              - column:
                  name: lesson_id
        - createIndex:
            indexName: idx_progress_status
            tableName: progress
            columns:
              - column:
                  name: lesson_status
