databaseChangeLog:
  - changeSet:
      id: 000-create-user-table
      author: copilot
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE TYPE user_role AS ENUM ('ADMIN', 'INSTRUCTOR', 'USER');
        - createSequence:
            sequenceName: user_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: user
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: dob
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: mobile_no
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: email_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: user_role
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: BIGINT
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: user
            columnNames: email_id
            constraintName: uk_user_email
        - addUniqueConstraint:
            tableName: user
            columnNames: mobile_no
            constraintName: uk_user_mobile
