databaseChangeLog:
  - changeSet:
      id: 004-create-enrollment-table
      author: copilot
      changes:
        - createSequence:
            sequenceName: enrollment_id_seq
            startValue: 1
            incrementBy: 1
        - sql:
            dbms: postgresql
            sql: CREATE TYPE course_completion_status AS ENUM ('INCOMPLETE', 'COMPLETE');
        - createTable:
            tableName: enrollment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_enrollment
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: course_completion_status
                  type: course_completion_status
                  defaultValue: INCOMPLETE
                  constraints:
                    nullable: false
              - column:
                  name: enrolled_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: enrollment
            baseColumnNames: user_id
            referencedTableName: user
            referencedColumnNames: id
            constraintName: fk_enrollment_user
        - addForeignKeyConstraint:
            baseTableName: enrollment
            baseColumnNames: course_id
            referencedTableName: course
            referencedColumnNames: id
            constraintName: fk_enrollment_course
        - addUniqueConstraint:
            tableName: enrollment
            columnNames: user_id, course_id
            constraintName: uk_enrollment
        - createIndex:
            indexName: idx_enrollment_user
            tableName: enrollment
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_enrollment_course
            tableName: enrollment
            columns:
              - column:
                  name: course_id
        - createIndex:
            indexName: idx_enrollment_status
            tableName: enrollment
            columns:
              - column:
                  name: course_completion_status
